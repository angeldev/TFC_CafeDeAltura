<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cliente.id != null} ? 'Editar cliente' : 'Nuevo cliente'">Cliente</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
<header th:replace="~{index :: header}"></header>
<main>
    <form class="formulario" th:action="${cliente.id != null} ? @{'/clientes/' + ${cliente.id} + '/editar'} : @{/clientes/nuevo}" method="post">
        <h2 th:text="${cliente.id != null} ? 'Editar cliente' : 'Nuevo cliente'"></h2>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" th:value="${cliente.nombre}" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" th:value="${cliente.email}" required>
        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" name="telefono" th:value="${cliente.telefono}">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" th:value="${cliente.direccion}">
        <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Guardar</button>
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <div th:if="${success}" class="success" th:text="${success}"></div>
        <div style="margin-top:1rem; text-align:center;">
            <a th:href="@{/clientes}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
</main>
<footer th:replace="~{index :: footer}"></footer>
</body>
</html>
