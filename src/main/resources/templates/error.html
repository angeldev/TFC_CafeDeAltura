<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Café de Altura</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
    <header th:replace="~{index :: header}"></header>
    <main>
        <section class="formulario" style="text-align:center;">
            <h2>¡Vaya! Algo salió mal.</h2>
            <div th:if="${mensaje}" class="error" th:text="${mensaje}"></div>
            <a th:href="@{/}" class="btn btn-primary" style="margin-top:1.2rem;">Volver al inicio</a>
        </section>
    </main>
    <footer th:replace="~{index :: footer}"></footer>
</body>
</html>
