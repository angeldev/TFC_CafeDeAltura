<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cafe.id != null} ? 'Editar café' : 'Nuevo café'">Café</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
<header th:replace="~{index :: header}"></header>
<main>
    <form class="formulario" th:action="${cafe.id != null} ? @{'/cafes/' + ${cafe.id} + '/editar'} : @{/cafes/nuevo}" method="post">
        <h2 th:text="${cafe.id != null} ? 'Editar café' : 'Nuevo café'"></h2>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" th:value="${cafe.nombre}" required>
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" required th:text="${cafe.descripcion}"></textarea>
        <label for="precio">Precio (€)</label>
        <input type="number" id="precio" name="precio" min="0.01" step="0.01" th:value="${cafe.precio}" required>
        <label for="origen">Origen</label>
        <input type="text" id="origen" name="origen" th:value="${cafe.origen}" required>
        <label for="intensidad">Intensidad (1-10)</label>
        <input type="number" id="intensidad" name="intensidad" min="1" max="10" th:value="${cafe.intensidad}" required>
        <label for="stock">Stock</label>
        <input type="number" id="stock" name="stock" min="0" th:value="${cafe.stock}" required>
        <label for="imagen">Imagen (opcional)</label>
        <input type="text" id="imagen" name="imagen" th:value="${cafe.imagen}">
        <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Guardar</button>
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <div th:if="${success}" class="success" th:text="${success}"></div>
        <div style="margin-top:1rem; text-align:center;">
            <a th:href="@{/cafes}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
</main>
<footer th:replace="~{index :: footer}"></footer>
</body>
</html>
