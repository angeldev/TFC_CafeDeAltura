<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Café de Altura</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
    <header th:replace="index :: header"></header>
    <main>
        <form class="formulario" th:action="@{/registro}" method="post">
            <h2>Crear cuenta</h2>
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required th:value="${nombre}">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required th:value="${email}">
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" name="telefono" th:value="${telefono}">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion" th:value="${direccion}">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" class="btn btn-primary">Registrarse</button>
            <div th:if="${error}" class="error" th:text="${error}">Error en el registro. Revisa los datos.</div>
            <div th:if="${success}" class="success" th:text="${success}"></div>
            <div style="margin-top:1rem; text-align:center;">
                <a th:href="@{/login}">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </form>
    </main>
    <footer th:replace="index :: footer"></footer>
</body>
</html>
