<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Café de Altura</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
    <header th:replace="~{index :: header}"></header>
    <main>
        <form class="formulario" th:action="@{/login}" method="post">
            <h2>Iniciar sesión</h2>
            <label for="username">Usuario o email</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" class="btn btn-primary">Entrar</button>
            <div th:if="${param.registro}" class="success">Registro exitoso. Ahora puedes iniciar sesión.</div>
            <div th:if="${param.error}" class="error">Usuario o contraseña incorrectos.</div>
            <div style="margin-top:1rem; text-align:center;">
                <a th:href="@{/registro}">¿No tienes cuenta? Regístrate</a>
            </div>
        </form>
    </main>
    <footer th:replace="~{index :: footer}"></footer>
</body>
</html>
