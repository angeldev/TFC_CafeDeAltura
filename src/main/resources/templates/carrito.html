<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Café de Altura</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
    <header th:replace="~{index :: header}"></header>
    <main>
        <h1 style="text-align:center; margin-top:2rem;">Tu carrito</h1>
        <!-- Filtro de búsqueda en el carrito -->
        <form method="get" action="/carrito" style="display:flex; flex-wrap:wrap; gap:1rem; justify-content:center; margin-bottom:1rem;">
            <input type="text" name="nombre" placeholder="Buscar café en el carrito" th:value="${param.nombre}" />
            <input type="number" name="minCantidad" min="1" placeholder="Cantidad mínima" th:value="${param.minCantidad}" style="width:120px;" />
            <button type="submit" class="btn btn-primary">Filtrar</button>
        </form>
        <div th:if="${carrito.lineas.size() == 0}" style="text-align:center; margin:2rem 0;">
            <p>Tu carrito está vacío.</p>
            <a th:href="@{/cafes}" class="btn btn-primary">Ver cafés</a>
        </div>
        <div th:if="${carrito.lineas.size() > 0}">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>Café</th>
                        <th>Cantidad</th>
                        <th>Precio unitario</th>
                        <th>Subtotal</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="linea : ${carrito.lineas}">
                        <td th:text="${linea.cafe.nombre}">Café</td>
                        <td th:text="${linea.cantidad}">2</td>
                        <td th:text="${#numbers.formatDecimal(linea.cafe.precio, 1, 'POINT', 2, 'NONE')} + ' €'">10,00 €</td>
                        <td th:text="${#numbers.formatDecimal(linea.cafe.precio * linea.cantidad, 1, 'POINT', 2, 'NONE')} + ' €'">20,00 €</td>
                        <td>
                            <form th:action="@{/carrito/modificar}" method="post" style="display:inline;">
                                <input type="hidden" name="idCafe" th:value="${linea.cafe.id}" />
                                <label for="cantidad_${linea.cafe.id}" class="sr-only">Cantidad</label>
                                <input type="number" name="cantidad" id="cantidad_${linea.cafe.id}" min="1" max="99" th:value="${linea.cantidad}" style="width:50px;">
                                <button type="submit" class="btn btn-outline">Actualizar</button>
                            </form>
                            <form th:action="@{/carrito/eliminar}" method="post" style="display:inline;">
                                <input type="hidden" name="idCafe" th:value="${linea.cafe.id}" />
                                <button type="submit" class="btn btn-secondary">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div style="text-align:right; margin:1.5rem 2rem 0 0;">
                <form th:action="@{/carrito/vaciar}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-outline">Vaciar carrito</button>
                </form>
                <form th:action="@{/carrito/confirmar}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-primary">Confirmar pedido</button>
                </form>
            </div>
        </div>
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <div th:if="${success}" class="success" th:text="${success}"></div>
    </main>
    <footer th:replace="~{index :: footer}"></footer>
</body>
</html>
