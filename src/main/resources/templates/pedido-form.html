<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pedido.id != null} ? 'Editar pedido' : 'Nuevo pedido'">Pedido</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
    <script th:inline="javascript">
        function addLinea() {
            const container = document.getElementById('lineas-container');
            const template = document.getElementById('linea-template').innerHTML;
            const index = container.children.length;
            const html = template.replace(/__INDEX__/g, index);
            container.insertAdjacentHTML('beforeend', html);
        }
        function removeLinea(btn) {
            btn.closest('.linea-row').remove();
        }
    </script>
</head>
<body>
<header th:replace="~{index :: header}"></header>
<main>
    <form class="formulario" th:action="${pedido.id != null} ? @{'/pedidos/' + ${pedido.id} + '/editar'} : @{/pedidos/nuevo}" method="post">
        <h2 th:text="${pedido.id != null} ? 'Editar pedido' : 'Nuevo pedido'"></h2>
        <label for="cliente">Cliente</label>
        <select id="cliente" name="cliente.id" required>
            <option th:each="cli : ${clientes}" th:value="${cli.id}" th:text="${cli.nombre}" th:selected="${pedido.cliente != null and cli.id == pedido.cliente.id}"></option>
        </select>
        <label>Líneas de pedido</label>
        <div id="lineas-container">
            <div th:each="linea, iterStat : ${pedido.lineas}" class="linea-row" style="margin-bottom:0.5rem;">
                <label th:for="'linea-cafe-' + ${iterStat.index}" class="sr-only">Café</label>
                <select th:id="'linea-cafe-' + ${iterStat.index}" th:name="'lineas[' + ${iterStat.index} + '].cafe.id'" required title="Selecciona el café">
                    <option th:each="cafe : ${cafes}" th:value="${cafe.id}" th:text="${cafe.nombre}" th:selected="${linea.cafe != null and cafe.id == linea.cafe.id}"></option>
                </select>
                <label th:for="'linea-cantidad-' + ${iterStat.index}" class="sr-only">Cantidad</label>
                <input type="number" th:id="'linea-cantidad-' + ${iterStat.index}" th:name="'lineas[' + ${iterStat.index} + '].cantidad'" min="1" max="99" th:value="${linea.cantidad}" required style="width:60px;" placeholder="Cantidad" title="Cantidad">
                <button type="button" onclick="removeLinea(this)">Eliminar</button>
            </div>
        </div>
        <button type="button" onclick="addLinea()" style="margin-bottom:1rem;">Añadir línea</button>
        <label for="estado">Estado</label>
        <select id="estado" name="estado" required>
            <option value="PENDIENTE" th:selected="${pedido.estado == 'PENDIENTE'}">PENDIENTE</option>
            <option value="ENVIADO" th:selected="${pedido.estado == 'ENVIADO'}">ENVIADO</option>
            <option value="CANCELADO" th:selected="${pedido.estado == 'CANCELADO'}">CANCELADO</option>
        </select>
        <label for="comentario">Comentario (opcional)</label>
        <textarea id="comentario" name="comentario" th:text="${pedido.comentario}"></textarea>
        <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Guardar</button>
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <div th:if="${success}" class="success" th:text="${success}"></div>
        <div style="margin-top:1rem; text-align:center;">
            <a th:href="@{/pedidos}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
    <template id="linea-template">
        <div class="linea-row" style="margin-bottom:0.5rem;">
            <label class="sr-only" for="linea-cafe-nuevo">Café</label>
            <select id="linea-cafe-nuevo" name="lineas[__INDEX__].cafe.id" required title="Selecciona el café">
                <option th:each="cafe : ${cafes}" th:value="${cafe.id}" th:text="${cafe.nombre}"></option>
            </select>
            <label class="sr-only" for="linea-cantidad-nuevo">Cantidad</label>
            <input type="number" id="linea-cantidad-nuevo" name="lineas[__INDEX__].cantidad" min="1" max="99" value="1" required style="width:60px;" placeholder="Cantidad" title="Cantidad">
            <button type="button" onclick="removeLinea(this)">Eliminar</button>
        </div>
    </template>
</main>
<footer th:replace="~{index :: footer}"></footer>
</body>
</html>
